name: Validate and package theme
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and compatibility contracts
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/ui.php
      - name: JavaScript syntax
        run: |
          node --check js/bcb-ui.js
          node --check js/scripts.js
      - name: Package
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*Version: *//p' style.css | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          python3 scripts/package-release.py --version "$VERSION" --output "$RUNNER_TEMP/bootstrap-component-blox.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-component-blox
          path: ${{ runner.temp }}/bootstrap-component-blox.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-component-blox
      - uses: softprops/action-gh-release@v2
        with:
          files: bootstrap-component-blox.zip
          generate_release_notes: true
          draft: true
          prerelease: false
